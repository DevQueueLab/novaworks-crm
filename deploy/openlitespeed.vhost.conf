docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
adminEmails               admin@praivox.com
enableGzip                1
enableIpGeo               1

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

# Next.js (novaworks-web) published on loopback only. initTimeout is generous
# because "Create from transcript" waits on the AI model before responding.
extprocessor novaworksweb {
  type                    proxy
  address                 127.0.0.1:4800
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             180
  retryTimeout            0
  respBuffer              0
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteCond %{HTTPS} !on
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
END_rules
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite  {
     enable                  0
  }
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 novaworksweb
  addDefaultCharset       off
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/novaworks.devqueue.co/privkey.pem
  certFile                /etc/letsencrypt/live/novaworks.devqueue.co/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling           1
  ocspRespMaxAge           86400
}
