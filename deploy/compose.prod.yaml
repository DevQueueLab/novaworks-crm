# NovaWorks CRM — production stack on the shared VPS (installed as /opt/novaworks/compose.yaml).
#
# OpenLiteSpeed terminates HTTPS for novaworks.devqueue.co and proxies to
# 127.0.0.1:4800. Nothing binds a public interface; the database publishes no
# port at all. Secrets come from /opt/novaworks/.env (root-only, never in git).
#
# Every container is capped (memory, CPU, log size) because other apps share
# this host: an overrun must kill OUR container, never a neighbour's process.
name: novaworks

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine
    container_name: novaworks-db
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    cpus: 0.5
    shm_size: 128m
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: novaworks
      POSTGRES_USER: novaworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/novaworks/.env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaworks -d novaworks"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      # Packages the standalone output built by deploy/deploy.sh in a capped
      # container, so the image build itself needs almost no memory.
      dockerfile: deploy/runtime.Dockerfile
    image: novaworks-web:latest
    container_name: novaworks-web
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4800:3000"
    environment:
      DATABASE_URL: postgres://novaworks:${POSTGRES_PASSWORD}@db:5432/novaworks
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in /opt/novaworks/.env}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-}
      APP_URL: https://novaworks.devqueue.co

volumes:
  db_data:
