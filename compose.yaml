# Local development.
#   docker compose up -d                       → PostgreSQL only (use with `pnpm dev`)
#   docker compose --profile app up --build    → PostgreSQL + the production build
name: novaworks-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: novaworks
      POSTGRES_USER: novaworks
      POSTGRES_PASSWORD: novaworks
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaworks -d novaworks"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://novaworks:novaworks@db:5432/novaworks
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
